name: Unzip File
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip DocScannerPro.zip -d extracted/
          rm DocScannerPro.zip

      - name: Remove build cache, IDE files, and secrets
        run: |
          rm -rf extracted/.gradle
          rm -rf extracted/build
          rm -rf extracted/.acside
          rm -f extracted/.env
          rm -f extracted/.env.example

      - name: Add .gitignore
        run: |
          cat >> extracted/.gitignore << 'EOF'
          .gradle/
          build/
          .acside/
          .env
          EOF

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip DocScannerPro.zip"
          git push
